packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.15'
  - '@expo/config@58.0.8'
  - '@expo/local-build-cache-provider@58.0.8'
  - '@expo/metro-config@58.0.17'
  - '@expo/prebuild-config@58.0.16'
  - '@expo/router-server@58.0.17'
  - babel-preset-expo@58.0.20
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-server@58.0.6
  - expo@58.0.19
  - expo-sqlite@58.0.14

overrides:
  # GHSA-q7qp-rjg7-q26m (DoS, high): force the patched multer across Nest.
  multer: ^2.5.0
