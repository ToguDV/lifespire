name: lifespire

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifespire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lifespire}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback-only by default: your own reverse proxy (Nginx Proxy Manager,
    # nginx, Traefik, Cloudflare Tunnel, …) reaches the API here without
    # this compose ever touching host ports 80/443. Override with
    # API_BIND=0.0.0.0 (or your LAN IP) when the proxy runs on another host.
    ports:
      - '${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      # Image default; set WEB_DIST_DIR= (empty) to run the API only.
      WEB_DIST_DIR: ${WEB_DIST_DIR-/srv/web}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifespire}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lifespire}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-lifespire}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lifespire-web}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-524288}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health/live').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:

volumes:
  pgdata:
