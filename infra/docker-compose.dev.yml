name: lifespire-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lifespire
      POSTGRES_PASSWORD: lifespire
      POSTGRES_DB: lifespire
    ports:
      - '5433:5432'
    volumes:
      - lifespire-dev-pg:/var/lib/postgresql/data

volumes:
  lifespire-dev-pg:
