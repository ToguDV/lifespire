# LifeSpire full local stack with hot reload. One command:
#   docker compose -f infra/docker-compose.local.yml up --build
# Web:  http://localhost:5173   API: http://localhost:3000   DB: localhost:5433
# Code is bind-mounted: Nest restarts on API changes, Vite HMR applies web
# changes instantly. Secrets below are DEV-ONLY defaults, never production.
name: lifespire-local

# Shared mounts: repo bind (code, live) + isolated container node_modules
# (host modules stay untouched) + cached pnpm store.
x-app-volumes: &app-volumes
  - ..:/app
  - pnpm-store:/root/.local/share/pnpm/store
  - nm-root:/app/node_modules
  - nm-web:/app/apps/web/node_modules
  - nm-api:/app/apps/api/node_modules
  - nm-core:/app/packages/core/node_modules
  - nm-apiclient:/app/packages/api-client/node_modules

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lifespire
      POSTGRES_PASSWORD: lifespire
      POSTGRES_DB: lifespire
    ports:
      - '5433:5432'
    volumes:
      - lifespire-local-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifespire']
      interval: 5s
      timeout: 3s
      retries: 10

  install:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes: *app-volumes
    working_dir: /app
    environment:
      CI: "true"
      # Needed by prisma.config.ts at generate time (no connection opened).
      DATABASE_URL: postgresql://lifespire:lifespire@postgres:5432/lifespire
    command: >
      sh -c "pnpm install --frozen-lockfile
      && pnpm --filter @lifespire/api prisma:generate"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://lifespire:lifespire@postgres:5432/lifespire
      JWT_SECRET: local-dev-secret-0123456789abcdef-local-dev
      JWT_ISSUER: lifespire
      JWT_AUDIENCE: lifespire-web
      TOTP_ENCRYPTION_KEY: local-dev-totp-key-0123456789abcdef-dev
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_WEB_URL: http://localhost:5173
    volumes: *app-volumes
    working_dir: /app
    command: >
      sh -c "pnpm --filter @lifespire/api prisma:deploy
      && pnpm dev:api"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    depends_on:
      install:
        condition: service_completed_successfully
    ports:
      - '5173:5173'
    environment:
      VITE_SYNC_BASE_URL: http://localhost:3000
    volumes: *app-volumes
    working_dir: /app
    command: pnpm --filter @lifespire/web exec vite --host 0.0.0.0 --port 5173 --strictPort

volumes:
  lifespire-local-pg:
  pnpm-store:
  nm-root:
  nm-web:
  nm-api:
  nm-core:
  nm-apiclient:
