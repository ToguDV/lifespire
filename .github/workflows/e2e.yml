name: E2E

# End-to-end tests are intentionally NOT run on every change. They only run when
# files that can affect the functional core loop (domain, state/persistence,
# content, app shell, screens) or the E2E setup itself change.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/domain/**'
      - 'src/state/**'
      - 'src/content/**'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/ui/screens/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/domain/**'
      - 'src/state/**'
      - 'src/content/**'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/ui/screens/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
