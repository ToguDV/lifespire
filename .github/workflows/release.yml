name: Release

# Artifacts are only produced from an explicit version tag. Bump the version in
# the root, desktop and mobile manifests, commit, then:
#   git tag v0.4.0 && git push origin v0.4.0
# The Android job also refreshes the self-hosted F-Droid repo; see
# docs/FDROID.md for the one-time secrets and Pages setup.
#
# Release notes are part of the release contract: the mandatory `What changed`
# section is generated from the commits since the previous v* tag and must never
# be replaced by a generic downloads list. Write descriptive squash commit/PR
# titles.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Windows installers are unsigned in this release line.
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify the tag matches the manifests
        run: node .github/scripts/verify-release-version.mjs

  quality:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check core parity
        run: bash scripts/check-core-parity.sh

      - name: Check release scripts
        run: |
          for file in scripts/fdroid-repo.sh scripts/verify-android-apk.sh; do
            bash -n "$file"
          done

      - name: Test release scripts
        run: |
          bash scripts/test-release-scripts.sh
          node --test scripts/fdroid-index.test.mjs

      - name: Approve native builds
        run: pnpm approve-builds --all

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck E2E
        run: pnpm typecheck:e2e

      - name: Build core for native tests
        # The Android Jest suite resolves @lifespire/core through its CJS
        # build output (used to be built as a side effect of the API hooks).
        run: pnpm --filter @lifespire/core build

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  desktop:
    needs: verify
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            builder_args: --linux
            artifact: lifespire-linux
            files: |
              apps/desktop/release/*.deb
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.tar.gz
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
          - os: windows-latest
            target: win
            builder_args: --win
            artifact: lifespire-windows
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @lifespire/web build

      - name: Build shell
        run: pnpm --filter @lifespire/desktop build

      - name: Package
        run: pnpm --filter @lifespire/desktop exec electron-builder ${{ matrix.builder_args }} --publish never

      - name: Verify the update channel files
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            test -f apps/desktop/release/latest-linux.yml
            test -f apps/desktop/release/linux-unpacked/resources/app-update.yml
          else
            test -f apps/desktop/release/latest.yml
            test -f apps/desktop/release/win-unpacked/resources/app-update.yml
          fi
          ls -la apps/desktop/release/latest*.yml

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version-code: ${{ steps.verify.outputs.version-code }}
      version-name: ${{ steps.verify.outputs.version-name }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Require the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN. Create an Expo access token and add it as a repository secret."
            exit 1
          fi
          if ! grep -qs "projectId" apps/mobile/app.config.ts apps/mobile/app.json; then
            echo "::error::The Expo project is not linked. Run \`eas init\` in apps/mobile and commit extra.eas.projectId."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Ensure Android build-tools
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/aapt" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "build-tools;36.0.0" >/dev/null
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          fi
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          "$BUILD_TOOLS/aapt" version

      - name: Build and download the APK (EAS cloud)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@^16 build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > "$RUNNER_TEMP/eas-build.json"

          node -e '
            const fs = require("node:fs");
            const file = process.env.RUNNER_TEMP + "/eas-build.json";
            const builds = JSON.parse(fs.readFileSync(file, "utf8"));
            const url = builds.at(-1)?.artifacts?.buildUrl;
            if (!url) {
              console.error("EAS did not return a buildUrl:", JSON.stringify(builds, null, 2));
              process.exit(1);
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + "/apk-url.txt", url);
          '

          version="${GITHUB_REF_NAME#v}"
          curl --fail --location "$(cat "$RUNNER_TEMP/apk-url.txt")" \
            --output "$GITHUB_WORKSPACE/LifeSpire-${version}.apk"

      - name: Verify the release APK
        id: verify
        env:
          ANDROID_APP_CERT_SHA256: ${{ secrets.ANDROID_APP_CERT_SHA256 }}
        run: bash scripts/verify-android-apk.sh "LifeSpire-${GITHUB_REF_NAME#v}.apk" "$GITHUB_REF_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifespire-android
          path: LifeSpire-*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [quality, desktop, android]
    # Desktop installers must not be held hostage by a missing Expo token or an
    # EAS outage; the android job still turns the run red so the gap is visible.
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      # Serialize with the manual F-Droid repair workflow; the generated branch
      # must never be force-pushed from two runs at once.
      group: fdroid-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes list the commits since the previous v* tag, so the
          # publish job needs the tag history, not just the current commit.
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Note a missing APK
        if: ${{ needs.android.result != 'success' }}
        run: echo "::warning::No Android APK for this tag (android=${{ needs.android.result }}). Check EXPO_TOKEN, eas init, EAS credentials and ANDROID_APP_CERT_SHA256."

      - name: Write the update manifest
        env:
          VERSION_CODE: ${{ needs.android.outputs.version-code }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="LifeSpire-${version}.apk"
          if [ -f "artifacts/$apk" ]; then
            VERSION="$version" TAG="$GITHUB_REF_NAME" APK="$apk" VERSION_CODE="${VERSION_CODE:?}" node -e '
              const fs = require("node:fs");
              const manifest = {
                version: process.env.VERSION,
                tag: process.env.TAG,
                publishedAt: new Date().toISOString(),
                android: {
                  versionCode: Number(process.env.VERSION_CODE),
                  apk: process.env.APK,
                },
              };
              fs.writeFileSync("artifacts/version.json", JSON.stringify(manifest, null, 2) + "\n");
            '
          else
            VERSION="$version" TAG="$GITHUB_REF_NAME" node -e '
              const fs = require("node:fs");
              const manifest = {
                version: process.env.VERSION,
                tag: process.env.TAG,
                publishedAt: new Date().toISOString(),
                android: null,
              };
              fs.writeFileSync("artifacts/version.json", JSON.stringify(manifest, null, 2) + "\n");
            '
          fi
          cat artifacts/version.json

      - name: Checksums
        working-directory: artifacts
        run: |
          ls -lh
          sha256sum ./* > SHA256SUMS.txt

      - name: Build the release notes
        run: |
          # The `What changed` section is mandatory. It is generated from the
          # commits since the previous v* tag; a generic downloads list is not a
          # release record.
          git fetch --tags --force origin
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            git log --pretty=format:'- %s (%h)' --no-merges "${previous_tag}..${GITHUB_REF_NAME}" > changes.md
          else
            git log --pretty=format:'- %s (%h)' --no-merges --max-count=100 "$GITHUB_REF_NAME" > changes.md
          fi
          if [ ! -s changes.md ] && [ -n "$previous_tag" ]; then
            # A merge-only range still has a change; use the merge subject.
            git log --pretty=format:'- %s (%h)' "${previous_tag}..${GITHUB_REF_NAME}" > changes.md
          fi
          if [ ! -s changes.md ]; then
            echo "::error::No commits found for the mandatory 'What changed' section."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          {
            echo "LifeSpire ${version} — desktop and Android builds for this tag."
            echo
            echo "### What changed"
            echo
            cat changes.md
            echo
            echo
            echo "### Downloads"
            echo
            for file in artifacts/*; do
              echo "- \`$(basename "$file")\` ($(du -h "$file" | cut -f1))"
            done
            echo
            echo "### Notes"
            echo
            echo "- Linux: install the \`.deb\` with \`sudo apt install ./LifeSpire-*.deb\`, or \`chmod +x\` the AppImage and run it. The AppImage updates in place from this release onward; the .deb may ask for system authentication."
            echo "- Windows: run the installer or unpack the portable zip. Installers are **unsigned**, so SmartScreen may warn (More info → Run anyway). The NSIS installer updates in place from this release onward; the zip is portable — use the installer or AppImage for automatic updates."
            echo "- Desktop users on an older version install this build once; later releases are offered automatically (Check for updates… in the menu)."
            echo "- Android: add the F-Droid repository \`https://togudv.github.io/lifespire/fdroid/repo/\` in F-Droid → Settings → Repositories, or sideload the APK attached here. Existing installs keep their save on the device."
            echo "- Saves stay on each device. Pair Android and desktop over the local network in Settings → Nearby devices; export and import also live in Settings."
            echo "- Verify downloads against \`SHA256SUMS.txt\`."
          } > release-notes.md
          cat release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Keep enriched notes from a previous run or a maintainer edit; only
            # backfill the section for an older release that lacks it.
            if ! gh release view "$GITHUB_REF_NAME" --json body --jq .body | grep -q '^### What changed$'; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "LifeSpire $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - uses: actions/setup-java@v4
        if: ${{ needs.android.result == 'success' }}
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: ${{ needs.android.result == 'success' }}

      - name: Ensure Android build-tools
        if: ${{ needs.android.result == 'success' }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/aapt" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "build-tools;36.0.0" >/dev/null
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          fi
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          "$BUILD_TOOLS/aapt" version

      - name: Install fdroidserver
        if: ${{ needs.android.result == 'success' }}
        run: |
          pip install --quiet 'fdroidserver==2.4.5'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refresh the F-Droid repository
        if: ${{ needs.android.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ needs.android.outputs.version-code }}
          APK_SOURCE: artifacts/LifeSpire-${{ needs.android.outputs.version-name }}.apk
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: bash scripts/fdroid-repo.sh
