name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects whether files that can affect the functional core loop changed.
  # E2E is not run on every change; it is gated behind this job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.filter.outputs.critical }}
      api: ${{ steps.filter.outputs.api }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            critical:
              - 'apps/web/src/domain/**'
              - 'apps/web/src/state/**'
              - 'apps/web/src/content/**'
              - 'apps/web/src/App.tsx'
              - 'apps/web/src/main.tsx'
              - 'apps/web/src/ui/**'
              - 'apps/web/src/styles/**'
              - 'apps/web/e2e/**'
              - 'apps/web/playwright.config.ts'
              - 'apps/web/package.json'
              - 'apps/mobile/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'apps/web/vite.config.ts'
              - 'apps/web/index.html'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            docker:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'scripts/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  quality:
    runs-on: ubuntu-latest
    env:
      # Dummy URL: prisma generate resolves config without connecting.
      DATABASE_URL: postgresql://lifespire:lifespire@localhost:5433/lifespire
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check core parity
        run: bash scripts/check-core-parity.sh

      - name: Approve native builds
        run: pnpm approve-builds --all

      - name: Prisma generate
        run: pnpm --filter @lifespire/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck E2E
        run: pnpm typecheck:e2e

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    needs: changes
    # Manual runs always execute; otherwise only when critical paths changed.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.critical == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @lifespire/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @lifespire/web test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  api-e2e:
    needs: changes
    # Manual runs always execute; otherwise only when the API or shared packages changed.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lifespire
          POSTGRES_PASSWORD: lifespire
          POSTGRES_DB: lifespire_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lifespire:lifespire@localhost:5433/lifespire_test
      JWT_SECRET: ci-secret-0123456789abcdef-ci-secret
      TOTP_ENCRYPTION_KEY: ci-totp-key-0123456789abcdef-ci-test
      PUBLIC_WEB_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Approve native builds
        run: pnpm approve-builds --all

      - name: Prisma generate
        run: pnpm --filter @lifespire/api prisma:generate

      - name: Migrate test database
        run: pnpm --filter @lifespire/api prisma:deploy

      - name: Run API flow tests
        run: pnpm --filter @lifespire/api test:e2e

  docker:
    needs: changes
    # Manual runs always execute; otherwise when API, web or packaging inputs changed.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: lifespire-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm -i --entrypoint sh lifespire-api:ci -s <<'EOF'
          set -eu
          test -f /srv/web/index.html
          test -f dist/main.js
          sh scripts/prisma-client-dir.sh /srv/api >/dev/null
          node -e 'require("@prisma/client"); console.log("prisma client ok")'
          test "$(id -u)" != "0"
          EOF
