name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects whether files that can affect the functional core loop changed.
  # E2E is not run on every change; it is gated behind this job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.filter.outputs.critical }}
      mobile-native: ${{ steps.filter.outputs.mobile-native }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            critical:
              - 'apps/web/src/domain/**'
              - 'apps/web/src/state/**'
              - 'apps/web/src/content/**'
              - 'apps/web/src/App.tsx'
              - 'apps/web/src/main.tsx'
              - 'apps/web/src/ui/**'
              - 'apps/web/src/styles/**'
              - 'apps/web/src/sync/**'
              - 'apps/web/e2e/**'
              - 'apps/web/playwright.config.ts'
              - 'apps/web/package.json'
              - 'apps/mobile/**'
              - 'apps/desktop/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'apps/web/vite.config.ts'
              - 'apps/web/index.html'
              - '.github/workflows/ci.yml'
            mobile-native:
              - 'apps/mobile/**'
              - 'packages/app-core/**'
              - 'packages/core/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check core parity
        run: bash scripts/check-core-parity.sh

      - name: Approve native builds
        run: pnpm approve-builds --all

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck E2E
        run: pnpm typecheck:e2e

      - name: Build core for native tests
        # The Android Jest suite resolves @lifespire/core through its CJS
        # build output (used to be built as a side effect of the API hooks).
        run: pnpm --filter @lifespire/core build

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    needs: changes
    # Manual runs always execute; otherwise only when critical paths changed.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.critical == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @lifespire/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @lifespire/web test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  mobile-native:
    needs: changes
    # The LAN node is Kotlin; Metro alone cannot catch a native compile error.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile-native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The action default ("tools platform-tools") no longer installs:
          # the "tools" package was removed from sdkmanager. Expo SDK 58 /
          # React Native 0.88 compile against API 35.
          packages: platform-tools "platforms;android-35" "build-tools;35.0.0"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: pnpm --filter @lifespire/mobile exec expo prebuild --platform android --no-install

      - name: Compile the Android app and the LAN module
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
