Summary: A quiet ascent through your goals
Description: |
  LifeSpire turns your goals and routines into a daily node map. Pick a few
  weekly targets, resolve the nodes that match your day, and close the run when
  the week ends.

  The app is local-first: saves stay on the device, nearby sync happens directly
  over the local network between Android and desktop, and there is no account,
  cloud copy or telemetry.
